upstream backend {
    # ưu tiên những backend ít connect
    # least_conn;
    ip_hash;
    server 172.31.11.180:8080;
    server 172.31.12.200:8080;
    server 127.0.0.1:5003;
}

server {
        listen 80;
        listen [::]:80;
        server_name load-balancer.bui-van-tuan-lam.com;
        return 301  https://$host$request_uri;
}

server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name load-balancer.bui-van-tuan-lam.com;

        ssl_certificate /etc/nginx/ssl/bui-van-tuan-lam.com.crt;
        ssl_certificate_key /etc/nginx/ssl/bui-van-tuan-lam.com.key;

        location / {
                proxy_pass  http://backend;
                include proxy_params;
        }
}
